name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Lint for unused imports and undefined names
        run: |
          pip install pyflakes
          python -m pyflakes backend/app backend/tests scripts/*.py

      # The fixtures are generated rather than committed, so the suite also
      # proves scripts/make_test_data.py still produces valid geometry.
      - name: Generate test fixtures
        run: python scripts/make_test_data.py test-data

      - name: Run tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m pytest -q

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Typecheck and build
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only - starting the stack is covered by the end-to-end job.
      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend
          push: false
          load: true
          tags: peo-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: false
          load: true
          tags: peo-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: End-to-end workflow in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        run: pip install -r backend/requirements.txt

      - name: Install frontend and build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Generate test fixtures
        run: python scripts/make_test_data.py test-data

      - name: Install Playwright with Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start the API
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 1
          done

      - name: Serve the built frontend
        working-directory: frontend
        run: |
          nohup npm run preview > /tmp/web.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null http://127.0.0.1:4173/ && break
            sleep 1
          done

      - name: Run the end-to-end check
        run: node scripts/e2e_check.mjs http://127.0.0.1:4173 test-data/bracket.stl

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            /tmp/api.log
            /tmp/web.log
          if-no-files-found: ignore
